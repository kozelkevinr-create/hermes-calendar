[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-calendar"
version = "0.0.1"
description = "Local-first calendar plugin for Hermes Agent: events, recurrence, reminders, and sync."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hermes Calendar contributors" }]
keywords = ["hermes", "hermes-agent", "calendar", "reminders"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  # Pure-Python RFC 5545 recurrence grammar; present in the Hermes runtime.
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "PyYAML>=6.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
hermes-calendar = "hermes_calendar.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_calendar*"]

[tool.setuptools.package-data]
hermes_calendar = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "PT", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["hermes_calendar", "tests", "scripts"]
strict = true
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs network, credentials, or a running Hermes install",
]

[tool.coverage.run]
branch = true
source = ["hermes_calendar"]
omit = ["hermes_calendar/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

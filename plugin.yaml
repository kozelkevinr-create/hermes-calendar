# Hermes plugin manifest.
# Contract: plugin.yaml + __init__.py::register(ctx) in this directory.
# Run `hermes plugins validate .` (Hermes >= 0.23) before opening a PR.
name: hermes-calendar
version: 0.0.1
description: "Local-first calendar for Hermes Agent: events, recurrence, reminders, and calendar sync."
author: "Hermes Calendar contributors"
kind: standalone
manifest_version: 2
requires_hermes: ">=0.23"
license: MIT
tags:
  - calendar
  - reminders
  - productivity
# Declarations below must match what register(ctx) actually registers.
# Hermes validates this drift, so add to both lists when a surface lands.
provides_tools:
  - calendar_status
  - calendar_list_calendars
  - calendar_create_calendar
  - calendar_create_event
  - calendar_get_event
  - calendar_update_event
  - calendar_delete_event
  - calendar_list_events
  - calendar_list_notifications
  - calendar_dismiss_notification
  - calendar_snooze_notification
provides_hooks: []
